name: Keystore backup (one-time, delete after use)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore keystore from secret
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore

      - name: Verify password and alias, show public fingerprint
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          keytool -list -v -keystore release.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E "Alias name|Valid from|SHA256"

      - name: Upload keystore backup (kept 1 day only)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: release.keystore
          retention-days: 1
