name: Build Android APK and AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web app
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Ensure Gradle Wrapper Configuration
        run: |
          mkdir -p android/gradle/wrapper
          printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\\://services.gradle.org/distributions/gradle-8.9-all.zip\nnetworkTimeout=10000\nvalidateDistributionUrl=true\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n" > android/gradle/wrapper/gradle-wrapper.properties
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Setup Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate Release Keystore
        run: |
          cd android/app
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias stickup \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass stickup123 \
              -keypass stickup123 \
              -dname "CN=DazoomInteractive, OU=Games, O=Dazoom, L=Tashkent, C=UZ"
          fi

      - name: Make Gradlew Executable
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            echo "Gradlew not found, generating wrapper..."
            gradle wrapper --gradle-version 8.9 || true
          fi
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Signed AAB and APK
        run: |
          cd android
          if [ -x "./gradlew" ]; then
            ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace
          else
            gradle :app:bundleRelease :app:assembleRelease --stacktrace
          fi

      - name: Upload Release Keystore (Kalit fayli)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: android/app/release.keystore

      - name: Upload AAB Artifact (Play Store uchun)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK Artifact (Test uchun)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
